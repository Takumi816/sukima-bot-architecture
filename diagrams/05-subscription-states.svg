  <rect x="40" y="103.27000000000001" width="120.49600000000001" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="100.248" y="130.17000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="100.248" dy="-3.9000000000000012">Unregistered</tspan><tspan x="100.248" dy="16.900000000000002">未登録</tspan></text>
</g>
<g class="node" data-id="requested" data-label="Requested
申請済み(決済待ち)" data-shape="rectangle">
  <rect x="420.624" y="103.27000000000001" width="167.92" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="504.584" y="130.17000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="504.584" dy="-3.9000000000000012">Requested</tspan><tspan x="504.584" dy="16.900000000000002">申請済み(決済待ち)</tspan></text>
</g>
<g class="node" data-id="stripe-active" data-label="STRIPE_ACTIVE
承認・利用可" data-shape="rectangle">
  <rect x="849.86" y="72.32" width="144.20799999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="921.9639999999999" y="99.22" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="921.9639999999999" dy="-3.9000000000000012">STRIPE_ACTIVE</tspan><tspan x="921.9639999999999" dy="16.900000000000002">承認・利用可</tspan></text>
</g>
<g class="node" data-id="stripe-canceled" data-label="STRIPE_CANCELED
失効・利用不可" data-shape="rectangle">
  <rect x="1263.7" y="103.27000000000001" width="167.91999999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1347.66" y="130.17000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="1347.66" dy="-3.9000000000000012">STRIPE_CANCELED</tspan><tspan x="1347.66" dy="16.900000000000002">失効・利用不可</tspan></text>
</g>
</svg>