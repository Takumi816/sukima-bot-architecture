<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1471.6200000000001 220.27" width="1471.6200000000001" height="220.27" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="unregistered" data-to="requested" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="「登録申請」でPayment Link発行" points="160.496,130.17000000000002 420.624,130.17000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="requested" data-to="stripe-active" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="checkout.session.completed を検証" points="588.544,121.20333333333333 616.544,121.20333333333333 616.544,99.22 849.86,99.22" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="stripe-active" data-to="stripe-canceled" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="customer.subscription.deleted を検証" points="994.068,99.22 1251.7,99.22 1251.7,121.20333333333333 1263.7,121.20333333333333" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="stripe-canceled" data-to="requested" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="再申請(トライアルなしリンク)" points="1263.7,139.13666666666666 1251.7,139.13666666666666 1251.7,161.12 1041.67,161.12 1041.67,139.13666666666666 588.544,139.13666666666666" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="stripe-active" data-to="stripe-active" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="「解約」でポータル案内" points="897.9293333333334,72.32 897.9293333333334,62.32 945.9986666666666,62.32 945.9986666666666,72.32" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="unregistered" data-to="requested" data-label="「登録申請」でPayment Link発行">
  <rect x="196.496" y="114.17000000000002" width="188.128" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="290.56" y="129.32000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">「登録申請」でPayment Link発行</text>
</g>
<g class="edge-label" data-from="requested" data-to="stripe-active" data-label="checkout.session.completed を検証">
