  <text x="1128.884" y="98.37" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">customer.subscription.deleted を検証</text>
</g>
<g class="edge-label" data-from="stripe-canceled" data-to="requested" data-label="再申請(トライアルなしリンク)">
  <rect x="1049.67" y="145.12" width="178.03000000000003" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="1138.6850000000002" y="160.27" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">再申請(トライアルなしリンク)</text>
</g>
<g class="edge-label" data-from="stripe-active" data-to="stripe-active" data-label="「解約」でポータル案内">
  <rect x="847.799" y="35.02" width="148.33" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="921.9639999999999" y="50.17" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">「解約」でポータル案内</text>
</g>
<g class="node" data-id="unregistered" data-label="Unregistered
